<div class="dropdown-menu" [class.open]="open()" (clickOutside)="handleClickOutside()">
    <div class="dropdown-content" [class.open]="open()">
        <div class="profile">
            <img src="profile.png" alt="profile">
        </div>
        <h3>{{user()?.name}}</h3>
        <div class="menu-item-container">
            @if (isProjectOpened()) {
            <div class="menu-item close" (click)="menuItemClick('close')">
                <span>Close Project</span>
                <div class="icon">
                    <i class="fa-solid fa-xmark"></i>
                </div>
            </div>
            }
            <div class="menu-item" (click)="menuItemClick('signout')">
                <span>Sign Out</span>
                <div class="icon">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </div>
            </div>
        </div>
    </div>
</div>
