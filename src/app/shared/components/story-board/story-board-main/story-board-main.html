<div class="storyboard-main-root" [class.single-view]="viewAs() === 'single'" [class.grid-view]="viewAs() === 'grid'">
    <div class="storyboard-main-image">
        @if (imageUrl() === 'generating') {
            <div class="loader-container" [style.width.px]="width()" [style.height.px]="height">
                <span class="loader"></span>
                <span class="generating-text">Generating...</span>
            </div>
        } @else {
            <img [src]="imageUrl()" alt="" [style.width.px]="width()" [style.height.px]="height">
        }
    </div>
    <div class="story-screenplay-info" [class.single-view]="viewAs() === 'single'">
        <div class="separator"></div>
        <div class="storyboard-main-info">
            <div class="scene-number">
                {{`Scene #${scene()?.sceneNumber}`}}
            </div>
            @if (viewAs() === 'single') {
                <div class="scene-duration">
                    <span class="duration-text">Duration: </span>
                    <span class="duration-time">{{scene()?.duration | timeFormat}}</span>
                </div>
            }
        </div>
        @if (viewAs() === 'single') {
            <div class="separator"></div>
            <div class="screenplay-info" [innerHTML]="scene()?.content"></div>
        }
    </div>

            </div>
        </div>
    </div> -->
</div>
