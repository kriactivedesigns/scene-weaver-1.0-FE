<div class="header-container">
    <div class="left-logo-menu" (click)="goTo(Pages.Dashboard)">
        <div class="logo">
            <img src="scene_weaver_logo_only.png" alt="logo">
        </div>
        <div class="branding">
            <span class="product">SceneWeaver 1.0</span>
            <span class="company">CausalSyntax Inc.</span>
        </div>
    </div>
    <div class="center-content-container">
        @if (globalState.getCurrentPage() === Pages.Dashboard) {
            <h3 class="dashboard-text">Dashboard</h3>
        } @else {
            <div class="breadcrumb-container">
                <div class="project-title">
                    <span>{{globalState.getCurrentProject()?.projectName}}</span>
                </div>
                <div class="breadcrumbs">
                    <div class="page" [class.active]="globalState.getCurrentPage() === Pages.Realm">
                        <span (click)="goTo(Pages.Realm)">Realm</span>
                    </div>
                    <div class="page" [class.active]="globalState.getCurrentPage() === Pages.Canvas">
                        <span (click)="goTo(Pages.Canvas)">Canvas</span>
                    </div>
                    <div class="page" [class.active]="globalState.getCurrentPage() === Pages.Story">
                        <span (click)="goTo(Pages.Story)">Story</span>
                    </div>
                    <div class="page" [class.active]="globalState.getCurrentPage() === Pages.Screenplay">
                        <span (click)="goTo(Pages.Screenplay)">Screenplay</span>
                    </div>
                    <div class="page" [class.active]="globalState.getCurrentPage() === Pages.Storyboard">
                        <span (click)="goTo(Pages.Storyboard)">Storyboard</span>
                    </div>
                    <div class="page" [class.active]="globalState.getCurrentPage() === Pages.Animatics">
                        <span (click)="goTo(Pages.Animatics)">Animatics</span>
                    </div>
                </div>
            </div>
        }
    </div>
    <div class="right-profile-menu">
        <div class="name-email">
            <div class="name">
                <span>John Doe</span>
            </div>
            <div class="email">
                <span>john.doe@causalsyntax.com</span>
            </div>
        </div>
        <div class="profile-image" (click)="openProfileDropdown()">
            <img src="profile.png" alt="img">
        </div>
        <div class="profile-dropdown-container">
            <profile-dropdown [open]="isDropdownOpen()"/>
        </div>
    </div>
</div>
