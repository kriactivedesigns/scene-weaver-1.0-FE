<div class="new-project-popup popup" [class.open]="open()">
    @if (open()) {
        <div class="popup-content-container">
            <div class="container">
                <div class="close-icon" (click)="close()">
                    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M1.4 14L0 12.6L5.6 7L0 1.4L1.4 0L7 5.6L12.6 0L14 1.4L8.4 7L14 12.6L12.6 14L7 8.4L1.4 14Z" fill="#1D1B20"/>
                    </svg>
                </div>
                <h3>Create a new Project</h3>
                <form [formGroup]="form" class="login-form input-form" (ngSubmit)="onSubmit()">
                    <div class="input-container">
                        <div class="input-label-container">
                            <input maxlength="128" class="input" type="text" id="projectName" placeholder=" " formControlName="projectName" required/>
                            <label for="projectName">Project Name</label>
                        </div>
                    </div>
                    <div class="input-group">
                        <div class="input-container">
                            <div class="input-label-container">
                                <input maxlength="5" class="input" type="text"
                                        id="aspectRatio" placeholder=" " formControlName="aspectRatio" required/>
                                <label for="aspectRatio">aspectRatio</label>
                            </div>
                        </div>
                        <div class="input-container">
                            <div class="input-label-container">
                                <input maxlength="5" class="input" type="text"
                                        id="visualStyle" placeholder=" " formControlName="visualStyle" required/>
                                <label for="visualStyle">Visual Style</label>
                            </div>
                        </div>
                    </div>
                    <div class="input-container">
                        <div class="input-label-container">
                            <input maxlength="128" class="input" type="text" id="description" placeholder=" " formControlName="description" required/>
                            <label for="description">Description</label>
                        </div>
                    </div>
                    <button class="primary-button" [disabled]="form.invalid" type="submit">
                        Create
                    </button>
                </form>
            </div>
        </div>
    }
</div>
