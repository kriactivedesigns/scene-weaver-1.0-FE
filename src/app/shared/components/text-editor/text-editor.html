<div class="story-editor-container">
    
    <ngx-editor-floating-menu [editor]="editor">
        <ngx-editor-menu [editor]="editor" [toolbar]="toolbar" [customMenuRef]="aimenu"/>
    </ngx-editor-floating-menu>
    <!-- Editable content area -->
    <ngx-editor [editor]="editor" [formControl]="contentControl" placeholder="Start writing your story here..." />
    <!-- Toolbar -->
</div>

@if (isPromptVisible) {
    <div
        class="floating-prompt-wrapper"
        [style.top]="floatingMenuPosition.top"
        [style.left]="floatingMenuPosition.left">
        <app-floating-prompt 
            (promptSubmit)="handlePromptSubmit($event)"
            (close)="isPromptVisible = false"
        />
    </div>
}

<ng-template #aimenu>
  <icon-button textIcon="aistar" (onclick)="openAIPrompt()"/>
</ng-template>
