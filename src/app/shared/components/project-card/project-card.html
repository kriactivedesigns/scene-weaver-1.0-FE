<div class="project-card" (click)="onProjectClick()">
    <span class="project-title">{{ project().projectName }}</span>
    <div class="labelled-content">
        <span class="label">Created On &nbsp;:&nbsp;</span>
        <span class="text">{{ project().createdOn }}</span>
    </div>
    <div class="labelled-content">
        <span class="label">Updated On :&nbsp;</span>
        <span class="text">{{ project().updatedOn }}</span>
    </div>
    <div class="labelled-content vertical">
        <span class="label">Description :</span>
        <span class="text">{{ project().description }}</span>
    </div>
</div>
