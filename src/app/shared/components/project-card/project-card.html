<div class="project-card">
    <span class="project-title" (click)="openProject(project())">{{ project().projectName }}</span>
    <div class="labelled-content">
        <span class="label">Created On:&nbsp;</span>
        <span class="text">{{ project().createdAt | date }}</span>
    </div>
    <div class="labelled-content">
        <span class="label">Updated On:&nbsp;</span>
        <span class="text">{{ project().updatedAt | date }}</span>
    </div>
    <div class="labelled-content delete">
        <icon-button icon="delete" (onclick)="onDeleteButtonClick()"/>
    </div>

</div>
