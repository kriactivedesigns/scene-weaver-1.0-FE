<div class="main-container">
    <div class="main-content-container">
        <div class="project-listing-container">
            <div class="project-list">
                <div class="project-cards-container">
                    @for (project of projectState.projects(); track $index) {
                        <app-project-card [project]="project" (onOpenProject)="handleOpenProjectOutput($event)"/>
                    }
                </div>
            </div>
            <div class="create-new-project-button-container">
                <button class="text-only-button" (click)="createProject()">+ Create a New Project</button>
            </div>
        </div>
    </div>
    <new-project-popup [open]="openPopup()" (openChange)="handleCreateProjectOpenChange($event)" (onProjectCreate)="handleCreateProjectOutput($event)"/>
</div>
