<div class="main-container">
  <div class="upper-section">
  </div>
  <div class="content-container">
    <div class="left">
    </div>
    <div class="middle">
      <div class="character-world-container">
        <div class="cards-container">
          <div class="header">
            <div class="label">
              Characters
            </div>
            <div class="button">
              <button class="text-only-button" (click)="openCharacterPopup()">
                + Add New Character
              </button>
            </div>
          </div>
          <div class="content">
            @for (character of realmState.characters(); track character.imagePath) {
              <character-card
                [character]="character"
                (ondelete)="deleteCharacter($event)"
                aspectRatio="3:4"
                (onedit)="openCharacterPopup(character)"
              />
            }
         </div>
        </div>
        <div class="cards-container">
          <div class="header">
            <div class="label">
              Worlds
            </div>
            <div class="button">
              <button class="text-only-button" (click)="openWorldPopup()">
                + Add New World
              </button>
            </div>
          </div>
          <div class="content">
            @for (world of realmState.worlds(); track world.imagePath) {
                <world-card
                  [world]="world"
                  (ondelete)="deleteWorld($event)"
                  aspectRatio="16:9"
                  (onedit)="openWorldPopup(world)"
              />
            }
          </div>
        </div>
      </div>
    </div>
    <div class="right">
      @if (getNextStage(Pages.Realm)) {
        <icon-button text="Next" icon="right" (onclick)="navigateTo(getNextStage(Pages.Realm))"/>
      }
    </div>
  </div>
</div>
@if (isCharacterPopupOpen()) {
  <new-character-popup [open]="isCharacterPopupOpen()"
                      [character]="openedCharacter()"
                      (onclose)="onCharacterPopupClose()"
                      (oncreate)="onCharacterCreateOrUpdate($event)"
                      (oncharacterupdate)="onCharacterCreateOrUpdate($event)"/>
}
@if (isWorldPopupOpen()) {
  <new-world-popup [open]="isWorldPopupOpen()"
                  [world]="openedWorld()"
                  (onclose)="onWorldPopupClose()"
                  (oncreate)="onWorldCreateOrUpdate($event)"
                  (onWorldUpdate)="onWorldCreateOrUpdate($event)"/>
}
