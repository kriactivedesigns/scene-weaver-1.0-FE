<div class="main-container">
  <div class="upper-section">
  </div>
  <div class="content-container">
    <div class="left">
    </div>
    <div class="middle">
      <div class="character-world-container">
        <div class="cards-container">
          <div class="header">
            <div class="label">
              Characters
            </div>
            <div class="button">
              <button class="text-only-button" (click)="openCharacterPopup()">
                + Add New Character
              </button>
            </div>
          </div>
          <div class="content">
            @for (character of realmState.characters(); track $index) {
              <character-card
                [character]="character"
                (ondelete)="deleteCharacter($event)"
                aspectRatio="4:5"
                (onedit)="openCharacterPopup(character)"
              />
            }
         </div>
        </div>
        <div class="cards-container">
          <div class="header">
            <div class="label">
              Worlds
            </div>
            <div class="button">
              <button class="text-only-button" (click)="openWorldPopup()">
                + Add New World
              </button>
            </div>
          </div>
          <div class="content">
            @for (world of realmState.worlds(); track $index) {
                <world-card
                  [world]="world"
                  (ondelete)="deleteWorld($event)"
                  aspectRatio="16:9"
                  (onedit)="openWorldPopup(world)"
              />
            }
          </div>
        </div>
      </div>
    </div>
    <div class="right">
      <icon-button text="Next" icon="right" (onclick)="navigateTo(Pages.Canvas)"/>
    </div>
  </div>
</div>
@if (isCharacterPopupOpen()) {
  <new-character-popup [open]="isCharacterPopupOpen()" [character]="character()" (onclose)="onCharacterPopupClose()" (oncreate)="onCharacterCreate($event)"/>
}
<new-world-popup [open]="isWorldPopupOpen()" [world]="world()" (onclose)="onWorldPopupClose()" (oncreate)="onWorldCreate($event)"/>
