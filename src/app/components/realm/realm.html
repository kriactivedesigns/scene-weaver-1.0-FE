<div class="main-container">
  <div class="upper-section">
  </div>
  <div class="content-container">
    <div class="left">
    </div>
    <div class="middle">
      <div class="character-world-container">
        <div class="cards-container">
          <div class="header">
            <div class="label">
              Characters
            </div>
            <div class="button">
              <button class="text-only-button" (click)="openPopup('character', 'add')">
                + Add New Character
              </button>
            </div>
          </div>
          <div class="content">
            @for (character of realmState.characters(); track $index) {
              <character-world-card
                [character]="character"
                (ondelete)="deleteCharacter($event)"
                aspectRatio="4:5"
                (onedit)="openPopup('character', 'update', character)"
              />
            }
         </div>
        </div>
        <div class="cards-container">
          <div class="header">
            <div class="label">
              Worlds
            </div>
            <div class="button">
              <button class="text-only-button" (click)="openPopup('world', 'add')">
                + Add New World
              </button>
            </div>
          </div>
          <div class="content">
            @for (world of realmState.worlds(); track $index) {
                <character-world-card
                  [character]="world"
                  (ondelete)="deleteWorld($event)"
                  aspectRatio="16:9"
                  (onedit)="openPopup('world', 'update', world)"
              />
            }
          </div>
        </div>
      </div>
    </div>
    <div class="right">
      <icon-button text="Next" icon="right" (onclick)="navigateTo(Pages.Canvas)"/>
    </div>
  </div>
</div>
<new-character-world-popup
        [type]="popupType()"
        [method]="popupMethod()"
        [open]="isPopupOpen()"
        (openChange)="handlePopupOpenChange($event)"
        (oncreate)="onCreate($event)"
        (ongenerate)="onGenerate($event)"
        [data]="popupData()"
/>
