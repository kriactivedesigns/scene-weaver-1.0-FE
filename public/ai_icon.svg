<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
    <title>Magic Wand Icon</title>
    <!-- The transparent background is default in SVG, so no background element is needed. -->
    
    <!-- This path creates the open, rounded square frame. -->
    <path d="M224,96v96a32,32,0,0,1-32,32H64a32,32,0,0,1-32-32V64A32,32,0,0,1,64,32h96" 
          fill="none" 
          stroke="black" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          stroke-width="20"/>
          
    <!-- This group contains the star shapes. -->
    <g fill="black" stroke="none">
        <!-- The main, large star -->
        <path d="M168,32l18.4,37.6L224,88l-37.6,18.4L168,144l-18.4-37.6L112,88l37.6-18.4Z"/>
        <!-- The smaller top-right star -->
        <path d="M224,24l-9.6,18.4L192,52l18.4,9.6L224,80l9.6-18.4L252,52l-18.4-9.6Z"/>
        <!-- The smaller bottom-right star -->
        <path d="M233,150l8,10l7,10l-10,8l-5,12l-8-10l-7-10l10-8Z"/>
    </g>
</svg>

