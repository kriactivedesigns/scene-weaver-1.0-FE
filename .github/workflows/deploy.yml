name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Firebase Tools
        run: npm install -g firebase-tools

      - name: Create service account file
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > $HOME/firebase-service-account.json

      - name: Authenticate Firebase with Service Account
        run: firebase use sceneweaver-1 --token $(cat $HOME/firebase-service-account.json | jq -r .private_key_id)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: $HOME/firebase-service-account.json

      - name: Build and Deploy to Production
        run: npm run release:prod:ci
        env:
          GOOGLE_APPLICATION_CREDENTIALS: $HOME/firebase-service-account.json